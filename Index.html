<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 mês de história</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* CSS ORIGINAL + EFEITOS NOVOS */
        :root { --bg-color: #080808; --bg-card: #151515; --text-main: #f5f5f5; --text-muted: #a0a0a0; --accent-gold: #D4AF37; --accent-pink: #FFB6C1; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-color); color: var(--text-main); overflow-x: hidden; }
        
        /* TELA HACKER */
        .hacker-screen { position: fixed; top:0; left:0; width:100%; height:100%; background: black; color: #0f0; font-family: 'Courier New', monospace; padding: 30px; z-index: 99999; display: flex; align-items: center; justify-content: center; }
        .hidden { display: none !important; }
        
        /* TELA LOGIN */
        .login-screen { position: fixed; top:0; left:0; width:100%; height:100%; background: #050505; z-index: 99998; display: flex; align-items: center; justify-content: center; text-align: center; }
        .login-box { background: var(--bg-card); padding: 40px; border-radius: 20px; border: 1px solid var(--accent-pink); width: 90%; max-width: 350px; }
        .input-form { width: 100%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid var(--accent-pink); border-radius: 8px; color: #fff; }
        .btn-login { background: var(--accent-gold); color: #000; padding: 12px 30px; border: none; border-radius: 25px; cursor: pointer; font-weight: 600; width: 100%; }

        /* O RESTO DO SEU CSS ORIGINAL FICA ABAIXO */
        .hero { height: 100vh; background: linear-gradient(rgba(0,0,0,0.15), rgba(0,0,0,0.85)), url('IMG_0992.jpeg') center/cover no-repeat; display: flex; flex-direction: column; justify-content: flex-end; text-align: center; padding-bottom: 60px; }
        .container { max-width: 600px; margin: 0 auto; padding: 0 20px; }
        .section-title { text-align: center; font-size: 2rem; color: var(--accent-gold); margin-bottom: 40px; }
        .gallery-item { margin-bottom: 40px; background: var(--bg-card); border-radius: 16px; overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,0.6); }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .stat-card { background: var(--bg-card); padding: 25px 15px; border-radius: 16px; text-align: center; border: 1px solid rgba(212, 175, 55, 0.1); }
        .stat-value { font-size: 1.8rem; color: var(--accent-gold); font-family: 'Playfair Display', serif; }
        .heart-particle { position: fixed; bottom: -10vh; pointer-events: none; z-index: 1; animation: floatUp 5s linear forwards; }
        @keyframes floatUp { 0% { transform: translateY(0); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateY(-110vh); opacity: 0; } }
    </style>
</head>
<body>

    <div id="hacker-screen" class="hacker-screen"><div id="hacker-text"></div></div>

    <div id="login-screen" class="login-screen hidden">
        <div class="login-box">
            <h2 style="color: var(--accent-pink); margin-bottom: 20px;">Verificação 🔐</h2>
            <input type="text" id="login-nome" placeholder="Seu nome" class="input-form">
            <input type="date" id="login-data" class="input-form">
            <button id="btn-entrar-site" class="btn-login">Desbloquear</button>
            <p id="erro-msg" style="color:red; margin-top:10px; display:none;">Dados incorretos!</p>
        </div>
    </div>

    <header class="hero">
        <div class="container">
            <h1>1 mês de história<br>(até agora)</h1>
            <h3>24 de maio &rarr; 24 de junho</h3>
        </div>
    </header>

    <section id="galeria" class="container">
        <h2 class="section-title">Registros</h2>
        <div class="gallery-item"><img src="IMG_0671_Original.jpeg" width="100%"></div>
        <div class="gallery-item"><img src="IMG_0986.jpeg" width="100%"></div>
        <div class="gallery-item"><img src="IMG_0984.jpeg" width="100%"></div>
    </section>

    <script>
        // HACKER
        const txt = document.getElementById('hacker-text');
        const msgs = ["Conectando...", "🚨 INVASÃO POR KAYKY 🚨", "Acessando arquivos..."];
        let i = 0;
        function digita() {
            if (i < msgs.length) { txt.innerHTML += msgs[i] + "<br>"; i++; setTimeout(digita, 800); }
            else { setTimeout(() => { document.getElementById('hacker-screen').classList.add('hidden'); document.getElementById('login-screen').classList.remove('hidden'); }, 1000); }
        }
        digita();

        // LOGIN
        document.getElementById('btn-entrar-site').onclick = () => {
            const nome = document.getElementById('login-nome').value.toLowerCase();
            const data = document.getElementById('login-data').value;
            if (nome.includes('cleice') && data === '2026-05-24') {
                document.getElementById('login-screen').classList.add('hidden');
                setInterval(() => {
                    const h = document.createElement('div'); h.className = 'heart-particle'; h.innerHTML = '❤️';
                    h.style.left = Math.random() * 100 + 'vw'; document.body.appendChild(h);
                    setTimeout(() => h.remove(), 5000);
                }, 400);
            } else { document.getElementById('erro-msg').style.display = 'block'; }
        };
    </script>
</body>
</html>
