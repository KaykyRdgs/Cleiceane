<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 mês de história</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #080808; --bg-card: #151515; --text-main: #f5f5f5; --accent-gold: #D4AF37; --accent-pink: #FFB6C1; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-color); color: var(--text-main); }
        
        /* Hacker e Login */
        .hacker-screen { position: fixed; top:0; left:0; width:100%; height:100%; background: black; color: #0f0; font-family: monospace; padding: 30px; z-index: 99999; display: flex; align-items: center; justify-content: center; }
        .envelope-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #050505; z-index: 99998; display: flex; align-items: center; justify-content: center; text-align: center; }
        .hidden { display: none !important; }
        .login-box { background: var(--bg-card); padding: 40px; border-radius: 20px; border: 1px solid var(--accent-pink); width: 90%; max-width: 350px; }
        .input-form { width: 100%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid var(--accent-pink); border-radius: 8px; color: #fff; }
        .btn-login { background: var(--accent-gold); color: #000; padding: 12px 30px; border: none; border-radius: 25px; cursor: pointer; font-weight: 600; width: 100%; }

        /* Layout Original */
        .hero { height: 100vh; background: linear-gradient(rgba(0,0,0,0.15), rgba(0,0,0,0.85)), url('IMG_0992.jpeg') center/cover; display: flex; flex-direction: column; justify-content: flex-end; text-align: center; padding-bottom: 60px; }
        .container { max-width: 600px; margin: 0 auto; padding: 40px 20px; }
        .gallery-item { margin-bottom: 40px; background: var(--bg-card); border-radius: 16px; padding: 20px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .stat-card { background: var(--bg-card); padding: 20px; border-radius: 15px; text-align: center; border: 1px solid #333; }
        .heart-particle { position: fixed; bottom: -10vh; pointer-events: none; z-index: 1; animation: floatUp 5s linear forwards; }
        @keyframes floatUp { 0% { transform: translateY(0); opacity: 0; } 100% { transform: translateY(-110vh); opacity: 0; } }
        
        /* Modal Doce */
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 999; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content { background: var(--bg-card); width: 90%; max-width: 350px; padding: 30px; border-radius: 20px; border: 1px solid var(--accent-pink); }
    </style>
</head>
<body>

    <div id="hacker-screen" class="hacker-screen"><div id="hacker-text"></div></div>

    <div id="envelope-screen" class="envelope-screen hidden">
        <div class="login-box">
            <h2 style="color: var(--accent-pink);">Verificação 🔐</h2>
            <input type="text" id="login-nome" placeholder="Seu nome" class="input-form">
            <input type="date" id="login-data" class="input-form">
            <button id="btn-desbloquear" class="btn-login">Desbloquear</button>
            <p id="erro-msg" style="color:red; margin-top:10px; display:none;">Dados incorretos!</p>
        </div>
    </div>

    <header class="hero">
        <div class="container">
            <h1 style="color: var(--accent-gold);">1 mês de história</h1>
            <p>O começo de tudo...</p>
        </div>
    </header>

    <div class="container">
        <h2>Registros</h2>
        <div class="gallery-item"><img src="IMG_0671_Original.jpeg" width="100%"></div>
        <div class="gallery-item"><img src="IMG_0986.jpeg" width="100%"></div>
        <div class="gallery-item"><img src="IMG_0984.jpeg" width="100%"></div>
        
        <h2>Estatísticas oficiais</h2>
        <div class="stats-grid">
            <div class="stat-card"><h3>1 Mês</h3><p>Tempo de história</p></div>
            <div class="stat-card"><h3>&infin;</h3><p>Doces</p></div>
        </div>
        <button id="btn-doce" style="margin-top:20px; padding:10px; border-radius:50%; background:none; border:none; font-size:30px; cursor:pointer;">🍭</button>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <p>Diagnóstico: Viciada em doces! 🍬</p>
            <button class="btn-login" onclick="document.getElementById('modal').classList.remove('active')">Fechar</button>
        </div>
    </div>

    <script>
        // Hacker
        const txt = document.getElementById('hacker-text');
        const msgs = ["Iniciando...", "🚨 INVASÃO POR KAYKY 🚨", "Acessando..."];
        let i = 0;
        function digita() {
            if (i < msgs.length) { txt.innerHTML += msgs[i] + "<br>"; i++; setTimeout(digita, 800); }
            else { setTimeout(() => { document.getElementById('hacker-screen').classList.add('hidden'); document.getElementById('envelope-screen').classList.remove('hidden'); }, 1000); }
        }
        digita();

        // Login
        document.getElementById('btn-desbloquear').onclick = () => {
            if (document.getElementById('login-nome').value.toLowerCase().includes('cleice') && document.getElementById('login-data').value === '2026-05-24') {
                document.getElementById('envelope-screen').classList.add('hidden');
            } else { document.getElementById('erro-msg').style.display = 'block'; }
        };

        // Doce
        document.getElementById('btn-doce').onclick = () => document.getElementById('modal').classList.add('active');
    </script>
</body>
</html>
